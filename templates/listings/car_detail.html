{% extends 'listings/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-10 offset-md-1">
            
            <a href="{% url 'car_list' %}" class="btn btn-link text-light text-decoration-none mb-3">
                <i class="bi bi-arrow-left me-1"></i> Обратно към офертите
            </a>

            <div class="feature-card p-4 p-md-5">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-start mb-4">
                    <div class="mb-3 mb-md-0">
                        <span class="badge-custom mb-2">{{ car.brand }} {{ car.model }}</span>
                        <h2 class="text-white fw-bold">{{ car.title }}</h2>
                        <div class="d-flex gap-3 text-light mt-2">
                            <span><i class="bi bi-calendar text-accent"></i> {{ car.year }} г.</span>
                            <span><i class="bi bi-cash-stack text-success"></i> Текуща цена: {{ car.price|floatformat:0 }} €</span>
                        </div>
                    </div>
                    <a href="{{ car.url }}" target="_blank" class="btn btn-primary-custom px-4 py-2">
                        Отвори в източника <i class="bi bi-box-arrow-up-right ms-1"></i>
                    </a>
                </div>

                <hr class="border-secondary mb-4" style="opacity: 0.1;">

                <h4 class="text-white mb-4"><i class="bi bi-graph-up-arrow text-accent me-2"></i> Тенденция на цената</h4>
                
                <div style="height: 400px; width: 100%; position: relative;">
                    <canvas id="priceChart"></canvas>
                </div>
                
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {

        const labels = JSON.parse('{{ chart_dates|escapejs }}');
        const dataPrices = JSON.parse('{{ chart_prices|escapejs }}');

        const ctx = document.getElementById('priceChart').getContext('2d');
        

        let gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(0, 240, 255, 0.4)'); // Неоново синьо горе
        gradient.addColorStop(1, 'rgba(0, 240, 255, 0.0)'); // Прозрачно долу
        
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Цена (€)',
                    data: dataPrices,
                    borderColor: '#00f0ff',
                    backgroundColor: gradient,
                    borderWidth: 3,
                    pointBackgroundColor: '#121212',
                    pointBorderColor: '#00f0ff',
                    pointHoverBackgroundColor: '#00f0ff',
                    pointHoverBorderColor: '#fff',
                    pointRadius: 5,
                    pointHoverRadius: 8,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        backgroundColor: 'rgba(18, 18, 18, 0.9)',
                        titleColor: '#00f0ff',
                        bodyColor: '#fff',
                        borderColor: 'rgba(0, 240, 255, 0.2)',
                        borderWidth: 1,
                        padding: 10,
                        displayColors: false,
                        callbacks: {
                            label: function(context) {
                                return context.parsed.y + ' €';
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        ticks: {
                            color: '#94a3b8',
                            callback: function(value) {
                                return value + ' €';
                            }
                        },
                        grid: {
                            color: 'rgba(255, 255, 255, 0.05)'
                        }
                    },
                    x: {
                        ticks: {
                            color: '#94a3b8'
                        },
                        grid: {
                            color: 'rgba(255, 255, 255, 0.05)'
                        }
                    }
                }
            }
        });
    });
</script>
{% endblock %}
