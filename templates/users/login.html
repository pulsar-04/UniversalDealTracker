{% extends "listings/base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-6 col-lg-4">

        <div class="text-center mb-5">
            <h2 class="fw-bolder text-white" style="letter-spacing: -0.5px;">Вход</h2>
            <p class="text-secondary small">Добре дошъл отново в системата.</p>
        </div>

        <div class="auth-card p-4 p-sm-5" style="background: rgba(15, 15, 20, 0.7); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; backdrop-filter: blur(10px);">
            <form method="POST">
                {% csrf_token %}
                {% if form.errors %}
                <div class="alert alert-danger p-2 mb-4 text-center small fw-bold" style="background: rgba(220,53,69,0.1); border: 1px solid rgba(220,53,69,0.5); color: #ff6b6b; border-radius: 8px;">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> Грешно потребителско име или парола!
                </div>
                {% endif %}
                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold text-uppercase mb-2" style="letter-spacing: 1px; font-size: 0.75rem;">Потребителско име</label>
                    <input type="text" name="username" class="form-control text-light custom-input" required>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold text-uppercase mb-2" style="letter-spacing: 1px; font-size: 0.75rem;">Парола</label>
                    <input type="password" name="password" class="form-control text-light custom-input" required>
                </div>
                <div class="text-end mt-2 mb-4">
                    <a href="{% url 'reset_password' %}" class="small text-decoration-none" style="color: #00f0ff; letter-spacing: 0.5px;">
                        Забравена парола?
                    </a>
                </div>
                <button type="submit" class="btn w-100 py-3 mt-3 fw-bold text-white" style="background: linear-gradient(135deg, #00f0ff 0%, #0070f3 100%); border: none; border-radius: 8px; letter-spacing: 0.5px;">
                    Влез в профила
                </button>
            </form>

            <div class="text-center mt-4 pt-4" style="border-top: 1px solid rgba(255,255,255,0.05);">
                <p class="text-secondary small mb-0">Нямаш акаунт? <a href="{% url 'register' %}" class="text-info text-decoration-none fw-semibold ms-1">Регистрирай се</a></p>
            </div>

        </div>
    </div>
</div>

<style>
    .custom-input {
        background-color: rgba(0, 0, 0, 0.3) !important;
        border: 1px solid rgba(255,255,255,0.1) !important;
        border-radius: 8px !important;
        padding: 0.8rem 1rem !important;
        transition: all 0.3s ease;
    }
    .custom-input:focus {
        border-color: #00f0ff !important;
        box-shadow: 0 0 0 0.2rem rgba(0, 240, 255, 0.15) !important;
        background-color: rgba(0, 0, 0, 0.5) !important;
    }
</style>
{% endblock %}
