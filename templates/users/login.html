{% extends "listings/base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-6 col-lg-5">
        <div class="auth-card">

            <div class="text-center mb-4">
                <h3 class="fw-bold text-white">
                    <i class="bi bi-box-arrow-in-right text-accent me-2"></i>Вход
                </h3>
                <p class="text-light small">Добре дошъл отново в системата</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label-custom">Потребителско име</label>
                    <input type="text" name="username" class="form-control-custom w-100" placeholder="Въведи своето име" required>
                </div>

                <div class="mb-4">
                    <label class="form-label-custom">Парола</label>
                    <input type="password" name="password" class="form-control-custom w-100" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 mt-2">
                    Влез в профила си
                </button>
            </form>

            <div class="auth-footer mt-4 pt-3" style="border-top: 1px solid var(--glass-border);">
                <small class="text-light">Нямаш акаунт? <a href="{% url 'register' %}" class="text-accent text-decoration-none ms-1">Регистрирай се</a></small>
            </div>

        </div>
    </div>
</div>
{% endblock %}
