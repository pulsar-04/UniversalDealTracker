{% extends "listings/base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center flex-grow-1" style="min-height: 75vh;">
    <div class="col-md-6 col-lg-4">

        <div class="text-center mb-5" data-aos="fade-down" data-aos-duration="800">
            <div class="d-inline-block mb-3 p-3 rounded-circle" style="background: rgba(0, 240, 255, 0.1); border: 1px solid var(--accent-color); box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);">
                <i class="bi bi-shield-lock text-accent fs-2"></i>
            </div>
            <h2 class="fw-bolder text-white" style="letter-spacing: -0.5px;">Добре дошъл!</h2>
            <p class="text-secondary small">Оторизация в DealTracker мрежата.</p>
        </div>

        <div class="auth-card p-4 p-sm-5 shadow-lg" data-aos="fade-up" data-aos-duration="1000" style="background: rgba(10, 10, 15, 0.65); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; backdrop-filter: blur(16px);">
            <form method="POST">
                {% csrf_token %}

                {% if form.errors %}
                <div class="alert alert-danger p-3 mb-4 text-center small fw-bold" style="background: rgba(220,53,69,0.1); border: 1px solid rgba(220,53,69,0.3); color: #ff6b6b; border-radius: 10px;">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> Отказан достъп. Опитай отново.
                </div>
                {% endif %}

                <div class="mb-4 position-relative">
                    <label class="form-label text-muted small fw-bold text-uppercase mb-2" style="letter-spacing: 1px; font-size: 0.75rem;">Потребителско име</label>
                    <div class="input-group">
                        <span class="input-group-text border-0" style="background: rgba(0,0,0,0.4); color: var(--text-muted);"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control text-light custom-input border-start-0 pl-0" required placeholder="admin_user">
                    </div>
                </div>

                <div class="mb-4 position-relative">
                    <label class="form-label text-muted small fw-bold text-uppercase mb-2" style="letter-spacing: 1px; font-size: 0.75rem;">Парола</label>
                    <div class="input-group">
                        <span class="input-group-text border-0" style="background: rgba(0,0,0,0.4); color: var(--text-muted);"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control text-light custom-input border-start-0 pl-0" required placeholder="••••••••">
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-3 mb-4">
                    <div class="form-check custom-checkbox">
                        <input class="form-check-input" type="checkbox" name="remember_me" id="rememberMe">
                        <label class="form-check-label text-light small" for="rememberMe" style="cursor: pointer; opacity: 0.8;">
                            Запомни ме
                        </label>
                    </div>
                    <a href="{% url 'reset_password' %}" class="small text-decoration-none hover-accent" style="color: var(--accent-color); letter-spacing: 0.5px; transition: 0.3s;">
                        Забравена парола?
                    </a>
                </div>

                <button type="submit" class="btn w-100 py-3 mt-2 fw-bold text-dark" style="background: linear-gradient(135deg, #00f0ff 0%, #0070f3 100%); border: none; border-radius: 12px; letter-spacing: 0.5px; box-shadow: 0 5px 15px rgba(0, 240, 255, 0.3); transition: transform 0.2s;">
                    Вход в системата <i class="bi bi-box-arrow-in-right ms-1"></i>
                </button>
            </form>

            <div class="text-center mt-4 pt-4" style="border-top: 1px solid rgba(255,255,255,0.05);">
                <p class="text-secondary small mb-0">Нов си тук? <a href="{% url 'register' %}" class="text-info text-decoration-none fw-bold ms-1 hover-accent">Инициализирай акаунт</a></p>
            </div>

        </div>
    </div>
</div>
{% endblock %}
