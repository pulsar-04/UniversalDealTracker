{% extends "listings/base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-6 col-lg-5">
        <div class="auth-card">

            <div class="text-center mb-4">
                <h3 class="fw-bold text-white">
                    <i class="bi bi-key text-accent me-2"></i>Смяна на парола
                </h3>
            </div>

            <form method="POST">
                {% csrf_token %}
                
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label-custom">{{ field.label }}</label>
                    <div class="custom-input-wrapper">
                        {{ field }}
                    </div>
                    {% for error in field.errors %}
                    <div class="text-danger small mt-1">{{ error }}</div>
                    {% endfor %}
                </div>
                {% endfor %}

                <button type="submit" class="btn btn-primary-custom w-100 mt-3">Обнови паролата</button>
                <a href="{% url 'profile_settings' %}" class="btn btn-secondary-custom w-100 mt-2">Отказ</a>
            </form>

        </div>
    </div>
</div>

<script>
    document.querySelectorAll('input').forEach(input => {
        input.classList.add('form-control-custom');
        input.classList.add('w-100');
    });
</script>
{% endblock %}
