{% extends "listings/base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center flex-grow-1" style="min-height: 75vh;">
    <div class="col-md-6 col-lg-5">

        <div class="auth-card text-center p-5 shadow-lg" data-aos="zoom-in" data-aos-duration="600" style="background: rgba(20, 10, 10, 0.65); border: 1px solid rgba(220, 53, 69, 0.25); border-radius: 20px; backdrop-filter: blur(16px);">

            <div class="mb-4 position-relative">
                <div class="position-absolute top-50 start-50 translate-middle" style="width: 100px; height: 100px; background: rgba(220, 53, 69, 0.2); border-radius: 50%; filter: blur(15px); animation: pulse-red 2s infinite;"></div>

                <div style="width: 80px; height: 80px; background: rgba(220, 53, 69, 0.1); border: 1px solid #dc3545; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 0 20px rgba(220, 53, 69, 0.3); position: relative; z-index: 2;">
                    <i class="bi bi-shield-lock-fill" style="font-size: 2.5rem; color: #dc3545;"></i>
                </div>
            </div>

            <h2 class="fw-bolder text-white mb-3" style="letter-spacing: -0.5px;">Достъпът е блокиран</h2>

            <p class="text-light opacity-75 mb-4 small" style="line-height: 1.6;">
                Системата за сигурност засече аномален брой неуспешни опити за оторизация от вашия IP адрес. Протоколът за защита е активиран.
            </p>

            <div class="alert p-3 mb-4 text-center fw-bold d-flex align-items-center justify-content-center gap-2" style="background: rgba(220,53,69,0.1); border: 1px solid rgba(220,53,69,0.3); color: #ff6b6b; border-radius: 12px;">
                <i class="bi bi-clock-history fs-5"></i> Временно ограничение: 15 минути
            </div>

            <a href="{% url 'landing' %}" class="btn w-100 py-3 fw-bold text-white mb-2" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; transition: all 0.3s ease;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='rgba(255,255,255,0.05)'">
                <i class="bi bi-arrow-left me-2"></i> Връщане към началния екран
            </a>

        </div>

    </div>
</div>

<style>
    @keyframes pulse-red {
        0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
        50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.2; }
        100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
    }
</style>
{% endblock %}
