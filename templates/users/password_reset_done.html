{% extends "listings/base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center flex-grow-1" style="min-height: 75vh;">
    <div class="col-md-6 col-lg-5">

        <div class="auth-card p-4 p-sm-5 text-center shadow-lg" data-aos="zoom-in" data-aos-duration="600" style="background: rgba(10, 10, 15, 0.65); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; backdrop-filter: blur(16px);">

            <div class="mb-4 position-relative">
                <div class="position-absolute top-50 start-50 translate-middle" style="width: 100px; height: 100px; background: rgba(16, 185, 129, 0.2); border-radius: 50%; filter: blur(15px); animation: pulse-green 2s infinite;"></div>

                <div style="width: 80px; height: 80px; background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success-color); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); position: relative; z-index: 2;">
                    <i class="bi bi-check-lg text-success" style="font-size: 3rem;"></i>
                </div>
            </div>

            <h2 class="fw-bolder text-white mb-3" style="letter-spacing: -0.5px;">Операцията е успешна!</h2>
            <p class="text-light opacity-75 mb-5 small" style="line-height: 1.6;">
                Вашият криптографски ключ беше успешно подменен. Мрежата е готова да ви посрещне с новите данни за достъп.
            </p>

            <a href="{% url 'login' %}" class="btn w-100 py-3 fw-bold text-dark" style="background: linear-gradient(135deg, #00f0ff 0%, #0070f3 100%); border: none; border-radius: 12px; letter-spacing: 0.5px; box-shadow: 0 5px 15px rgba(0, 240, 255, 0.3); transition: transform 0.2s;">
                <i class="bi bi-box-arrow-in-right me-1"></i> Вход в Системата
            </a>

        </div>

    </div>
</div>
{% endblock %}
