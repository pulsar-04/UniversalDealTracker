{% extends "listings/base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-6 col-lg-5">
        <div class="dashboard-card p-5 text-center">
            
            <div class="mb-4">
                <div style="width: 80px; height: 80px; background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success-color); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);">
                    <i class="bi bi-check-lg text-success" style="font-size: 3rem;"></i>
                </div>
            </div>

            <h2 class="fw-bolder text-white mb-3">Готово!</h2>
            <p class="text-light mb-4 small">
                Твоята парола беше успешно променена. Вече можеш да влезеш в профила си с новите данни.
            </p>

            <a href="{% url 'login' %}" class="btn w-100 py-3 fw-bold text-dark mb-3" style="background: linear-gradient(135deg, #00f0ff 0%, #0070f3 100%); border: none; border-radius: 8px;">
                <i class="bi bi-box-arrow-in-right me-1"></i> Влез в системата
            </a>

        </div>
    </div>
</div>
{% endblock %}
