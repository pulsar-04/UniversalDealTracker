{% extends "listings/base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-6 col-lg-5">

        <div class="dashboard-card p-5 text-center">
            
            <div class="mb-4">
                <div style="width: 80px; height: 80px; background: rgba(0, 240, 255, 0.1); border: 1px solid var(--accent-color); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);">
                    <i class="bi bi-key-fill text-accent" style="font-size: 2.5rem;"></i>
                </div>
            </div>

            <h2 class="fw-bolder text-white mb-3">Забравена парола?</h2>
            <p class="text-light mb-4 small">
                Въведи имейл адреса, с който си се регистрирал. Ще ти изпратим сигурен линк за създаване на нова парола.
            </p>

            <form method="POST" class="text-start">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold text-uppercase mb-2" style="letter-spacing: 1px;">Имейл адрес</label>
                    <input type="email" name="email" class="form-control text-light" style="background-color: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 0.8rem 1rem;" required id="id_email" placeholder="name@example.com">
                </div>
                
                <button type="submit" class="btn w-100 py-3 fw-bold text-dark mb-3" style="background: linear-gradient(135deg, #00f0ff 0%, #0070f3 100%); border: none; border-radius: 8px; letter-spacing: 0.5px;">
                    <i class="bi bi-envelope-paper me-1"></i> Изпрати линк
                </button>
            </form>

            <a href="{% url 'login' %}" class="text-muted small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Върни се към входа
            </a>

        </div>

    </div>
</div>

<style>
    input:focus {
        border-color: #00f0ff !important;
        box-shadow: 0 0 0 0.2rem rgba(0, 240, 255, 0.15) !important;
        background-color: rgba(0, 0, 0, 0.5) !important;
    }
</style>
{% endblock %}
