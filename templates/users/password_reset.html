{% extends "listings/base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center flex-grow-1" style="min-height: 75vh;">
    <div class="col-md-6 col-lg-5">

        <div class="auth-card p-4 p-sm-5 text-center shadow-lg" data-aos="zoom-in" data-aos-duration="600" style="background: rgba(10, 10, 15, 0.65); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; backdrop-filter: blur(16px);">

            <div class="mb-4 position-relative">
                <div class="position-absolute top-50 start-50 translate-middle" style="width: 100px; height: 100px; background: rgba(0, 240, 255, 0.2); border-radius: 50%; filter: blur(15px); animation: pulse-blue 2s infinite;"></div>

                <div style="width: 80px; height: 80px; background: rgba(0, 240, 255, 0.1); border: 1px solid var(--accent-color); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); position: relative; z-index: 2;">
                    <i class="bi bi-key-fill text-accent" style="font-size: 2.5rem;"></i>
                </div>
            </div>

            <h2 class="fw-bolder text-white mb-3" style="letter-spacing: -0.5px;">Забравена парола?</h2>
            <p class="text-light opacity-75 mb-4 small" style="line-height: 1.6;">
                Въведете имейл адреса, с който е регистриран акаунтът ви. Системата ще генерира еднократен криптографски ключ за възстановяване на достъпа.
            </p>

            <form method="POST" class="text-start">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold text-uppercase mb-2" style="letter-spacing: 1px; font-size: 0.75rem;">Имейл адрес</label>
                    <div class="custom-form-wrapper">
                        <input type="email" name="email" id="id_email" required placeholder="name@example.com">
                    </div>
                </div>

                <button type="submit" class="btn w-100 py-3 fw-bold text-dark mb-4" style="background: linear-gradient(135deg, #00f0ff 0%, #0070f3 100%); border: none; border-radius: 12px; letter-spacing: 0.5px; box-shadow: 0 5px 15px rgba(0, 240, 255, 0.3); transition: transform 0.2s;">
                    <i class="bi bi-envelope-paper me-1"></i> Инициирай Възстановяване
                </button>
            </form>

            <div class="pt-3" style="border-top: 1px solid rgba(255,255,255,0.05);">
                <a href="{% url 'login' %}" class="text-muted small text-decoration-none hover-accent" style="font-weight: 500; transition: 0.3s;">
                    <i class="bi bi-arrow-left me-1"></i> Прекрати и се върни към входа
                </a>
            </div>

        </div>

    </div>
</div>

<style>
    .custom-form-wrapper input {
        width: 100%;
        background-color: rgba(0, 0, 0, 0.4) !important;
        border: 1px solid rgba(255,255,255,0.1) !important;
        border-radius: 10px !important;
        padding: 0.9rem 1rem !important;
        color: #f8fafc !important;
        transition: all 0.3s ease;
    }
    .custom-form-wrapper input:focus {
        outline: none;
        border-color: #00f0ff !important;
        background-color: rgba(0, 0, 0, 0.6) !important;
        box-shadow: 0 0 15px rgba(0, 240, 255, 0.15) !important;
    }
    .hover-accent:hover { color: var(--accent-color) !important; text-shadow: 0 0 8px rgba(0, 240, 255, 0.5); }

    @keyframes pulse-blue {
        0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
        50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.2; }
        100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
    }
</style>
{% endblock %}
