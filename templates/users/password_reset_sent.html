{% extends "listings/base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-6 col-lg-5">
        <div class="dashboard-card p-5 text-center">
            
            <div class="mb-4">
                <div style="width: 80px; height: 80px; background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success-color); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin: 0 auto; box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);">
                    <i class="bi bi-envelope-check-fill text-success" style="font-size: 2.5rem;"></i>
                </div>
            </div>

            <h2 class="fw-bolder text-white mb-3">Провери си имейла!</h2>
            <p class="text-light mb-4 small">
                Изпратихме ти инструкции как да възстановиш паролата си. Ако не виждаш имейла, провери и папката "Спам".
            </p>

            <a href="{% url 'login' %}" class="btn w-100 py-3 fw-bold text-white mb-3" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;">
                Върни се към входа
            </a>
        </div>
    </div>
</div>
{% endblock %}
